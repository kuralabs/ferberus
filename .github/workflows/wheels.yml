name: Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# ferberus is built per CPython version (no abi3): the engine reads the
# caller's objects through the non-limited C-API, see DESIGN.md.
env:
  INTERPRETERS: "3.9 3.10 3.11 3.12 3.13 3.14 3.15 3.14t 3.15t"

jobs:
  linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64, manylinux: "2_28" }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { runner: ubuntu-24.04, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --strip --out dist --interpreter ${{ env.INTERPRETERS }}
      # cp39/cp310 on musl: see scripts/musl-suffix.py. dist/ belongs to root
      # (maturin-action builds in a container).
      - if: startsWith(matrix.manylinux, 'musllinux')
        run: sudo python3 scripts/musl-suffix.py dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install the interpreters
        shell: bash
        run: |
          uv python install $INTERPRETERS
          args=""
          for v in $INTERPRETERS; do args="$args --interpreter $(uv python find "$v")"; done
          echo "INTERPRETER_ARGS=$args" >> "$GITHUB_ENV"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --strip --out dist ${{ env.INTERPRETER_ARGS }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install the interpreters
        shell: bash
        run: |
          uv python install $INTERPRETERS
          args=""
          for v in $INTERPRETERS; do args="$args --interpreter $(uv python find "$v")"; done
          echo "INTERPRETER_ARGS=$args" >> "$GITHUB_ENV"
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --strip --out dist ${{ env.INTERPRETER_ARGS }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  # Every wheel must pass the upstream suite before anything is published.
  # The musllinux wheels run in Alpine containers: all interpreters as uv
  # installs them (python-build-standalone), plus the official python:3.9
  # and 3.10 images, whose extension suffix differs (scripts/musl-suffix.py).
  test:
    needs: [linux, macos, windows]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, wheels: wheels-linux-x86_64-2_28 }
          - { runner: ubuntu-24.04-arm, wheels: wheels-linux-aarch64-2_28 }
          - { runner: macos-latest, wheels: wheels-macos-aarch64 }
          - { runner: macos-15-intel, wheels: wheels-macos-x86_64 }
          - { runner: windows-latest, wheels: wheels-windows-x64 }
          - { runner: ubuntu-24.04, wheels: wheels-linux-x86_64-musllinux_1_2, alpine: true }
          - { runner: ubuntu-24.04-arm, wheels: wheels-linux-aarch64-musllinux_1_2, alpine: true }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pyeve/cerberus
          ref: 83f5dada76aa3179ef21b677a7f4235bf20c1566
          path: cerberus-upstream
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.wheels }}
          path: dist
      - uses: astral-sh/setup-uv@v10.3.3
        if: ${{ !matrix.alpine }}
      - name: Upstream suite against the built wheels
        if: ${{ !matrix.alpine }}
        shell: bash
        run: scripts/test-wheels.sh dist cerberus-upstream
      - name: Upstream suite against the built wheels (Alpine)
        if: ${{ matrix.alpine }}
        run: |
          docker run --rm -e INTERPRETERS -v "$PWD:/w" -w /w \
            ghcr.io/astral-sh/uv:0.13.8-alpine \
            sh -c 'apk add -q bash && scripts/test-wheels.sh dist cerberus-upstream'
          for v in 3.9 3.10; do
            echo "::group::python:$v-alpine"
            docker run --rm -v "$PWD:/w:ro" python:$v-alpine sh -c '
              set -e
              pip -q install --root-user-action=ignore --no-index --find-links /w/dist ferberus
              pip -q install --root-user-action=ignore pytest
              cd /tmp && FERBERUS_UPSTREAM_PACKAGE=/w/cerberus-upstream/cerberus \
                python -m pytest -p ferberus.compat -p no:cacheprovider \
                --rootdir /w/cerberus-upstream -c /w/cerberus-upstream/pyproject.toml \
                /w/cerberus-upstream/cerberus/tests -q'
            echo "::endgroup::"
          done

  # Trusted Publishing (OIDC): PyPI accepts uploads from this workflow in the
  # `pypi` environment, which only deploys `v*` tags. No secret is stored.
  publish:
    needs: [test, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/ferberus/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag and the files
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls dist
          [ "$(ls dist/*.whl | wc -l)" -eq 63 ] || { echo "expected 63 wheels"; exit 1; }
          [ -f "dist/ferberus-$version.tar.gz" ] || { echo "no sdist for $version"; exit 1; }
          bad=$(ls dist | grep -v -- "^ferberus-$version[-.]" || true)
          [ -z "$bad" ] || { echo "not version $version: $bad"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
