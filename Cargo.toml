[workspace]
members = [".", "crates/ferberus-regex"]
exclude = ["fuzz"]

[package]
name = "ferberus"
version = "1.0.1"
edition = "2024"
rust-version = "1.100"
description = "A drop-in, high-performance Rust reimplementation of the Cerberus validation library."
license = "ISC"
authors = ["KuraLabs S.R.L."]
repository = "https://github.com/kuralabs/ferberus"
publish = false

[lib]
name = "ferberus_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.30.1"
ferberus-regex = { path = "crates/ferberus-regex" }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
smallvec = "1.16.5"

[features]
# Measurement helpers for DESIGN.md; not for release builds.
experiments = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[lints.clippy]
all = { level = "deny", priority = -1 }
